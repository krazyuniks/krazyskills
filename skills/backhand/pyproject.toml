[project]
name = "backhand"
version = "0.0.1"
description = "Distil a long agent conversation into a compact, high-fidelity handoff for a fresh session."
readme = "DESIGN.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
backhand = "backhand.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8",
    "ruff>=0.9",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backhand"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.pyright]
include = ["backhand", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
