name: ci

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  backhand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv
      - name: Validate skills
        run: uv run --project skills/backhand python scripts/validate_skills.py
      - name: Ruff
        run: uv run --project skills/backhand --group dev ruff check skills/backhand scripts
      - name: Pyright
        run: uv run --project skills/backhand --group dev pyright
      - name: Pytest
        run: uv run --project skills/backhand --group dev pytest -q
